name: Verify StormChase
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r research/requirements.txt
      - run: PYTHONPATH=research python -m unittest discover -s research/tests -v
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run preview:portable
      - run: npm run check:portable
      - uses: actions/upload-artifact@v4
        with:
          name: stormchase-preview
          path: portable-preview/
